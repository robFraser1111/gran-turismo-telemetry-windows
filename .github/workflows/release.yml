name: release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish exe
        run: >
          dotnet publish src/GranTurismoTelemetry
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
      - name: Publish MSIX payload
        run: >
          dotnet publish src/GranTurismoTelemetry
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -p:CopyOutputSymbolsToPublishDirectory=false
          -o artifacts/msix/payload
      - name: Pack MSIX
        shell: pwsh
        run: >
          ./packaging/Pack.ps1
          -Payload artifacts/msix/payload
          -Version "${{ steps.meta.outputs.tag }}"
          -Out artifacts/msix/SlickDash.msix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          EXE="src/GranTurismoTelemetry/bin/Release/net8.0/win-x64/publish/GranTurismoTelemetry.exe"
          MSIX="artifacts/msix/SlickDash.msix"
          gh release create "$TAG" "$EXE" "$MSIX" --title "$TAG" --generate-notes
