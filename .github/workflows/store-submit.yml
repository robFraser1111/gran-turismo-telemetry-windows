name: store-submit

# Manual only. First Store listing must already be live in Partner Center.
# Uploads SlickDash.msix as a draft (--noCommit); it does not publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.9.2 or v0.9.2)"
        required: true

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Check Store secrets
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          STORE_PRODUCT_ID: ${{ secrets.STORE_PRODUCT_ID }}
        run: |
          missing=0
          for s in AZURE_AD_TENANT_ID AZURE_AD_APPLICATION_CLIENT_ID AZURE_AD_APPLICATION_SECRET SELLER_ID STORE_PRODUCT_ID; do
            eval "val=\${$s}"
            if [ -z "$val" ]; then
              echo "Missing secret $s"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the Partner Center / Entra secrets listed in packaging/README.md, then re-run."
            echo "The first SlickDash listing must already be live; this workflow only submits updates as drafts."
            exit 1
          fi
      - name: Publish MSIX payload
        run: >
          dotnet publish src/GranTurismoTelemetry
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=none
          -p:CopyOutputSymbolsToPublishDirectory=false
          -o artifacts/msix/payload
      - name: Pack MSIX
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ secrets.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: >
          ./packaging/Pack.ps1
          -Payload artifacts/msix/payload
          -Version "${{ github.event.inputs.version }}"
          -Out artifacts/msix/SlickDash.msix
      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Configure Microsoft Store CLI
        shell: pwsh
        run: >
          msstore reconfigure
          --tenantId ${{ secrets.AZURE_AD_TENANT_ID }}
          --sellerId ${{ secrets.SELLER_ID }}
          --clientId ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          --clientSecret ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      - name: Upload draft submission
        shell: pwsh
        run: >
          msstore publish "${{ github.workspace }}\artifacts\msix\SlickDash.msix"
          --appId ${{ secrets.STORE_PRODUCT_ID }}
          --noCommit
